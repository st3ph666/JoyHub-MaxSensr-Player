name: Migrate JoyHub MaxSensr Player v1.4.16

on:
  push:
    paths:
      - '.github/workflows/migrate-v1416.yml'
      - 'tools/migrate_v1416.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter for validation
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Adapt migration to legacy direct startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/migrate_v1416.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    if main_node is None:\n        raise RuntimeError("main() not found")\n', '')
          old = '''    main_code = '\"\"\"Application entry point.\"\"\"\\n\\nfrom .app import *  # noqa: F403,F401\\n\\n' + src(lines, main_node) + '\\nif __name__ == \"__main__\":\\n    raise SystemExit(main())\\n'\n'''
          new = '''    main_code = '\"\"\"Application entry point.\"\"\"\\n\\nfrom .app import App\\n\\ndef main():\\n    App().mainloop()\\n    return 0\\n\\nif __name__ == \"__main__\":\\n    raise SystemExit(main())\\n'\n'''
          if old not in s:
              raise SystemExit('Expected main_code template not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Migrate source
        run: python3 tools/migrate_v1416.py
      - name: Compile modules
        run: python3 -m compileall -q src/maxsensr_player MaxSensr-Funscript-Player-v1.4.16-PersistentResume.py
      - name: Verify imports
        run: PYTHONPATH=src python3 -c 'import maxsensr_player.main'
      - name: Remove compile caches and migration helpers
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f tools/migrate_v1416.py .github/workflows/migrate-v1416.yml
      - name: Commit migrated v1.4.16
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor v1.4.16 into modules with uv deployment'
          git push
